<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .flowHot  {stroke:#ff6b5e;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:11 8;animation:dash 1.1s linear infinite}
    .flowCold {stroke:#5aa7ff;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:11 8;animation:dash 1.1s linear infinite}
    .mon {stroke:#9fb3d9;stroke-width:1.6;fill:none;stroke-dasharray:5 5;animation:dash 3.2s linear infinite}
    .led {stroke:#38d6f0;stroke-width:9;stroke-dasharray:16 7;animation:dash 2.4s linear infinite, glow 2.4s ease-in-out infinite alternate}
    .lbl {fill:#dde4f2;font-size:15px}
    .sml {fill:#aab7d4;font-size:13px}
    .box {fill:#1d2533;stroke:#8fa2c8;stroke-width:1.8}
    @keyframes dash {to{stroke-dashoffset:-19}}
    @keyframes glow {from{opacity:.55}to{opacity:1}}
  </style>
  <defs>
    <marker id="aHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff6b5e"/>
    </marker>
    <marker id="aCold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5aa7ff"/>
    </marker>
    <marker id="aMon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9fb3d9"/>
    </marker>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e33"/><stop offset="1" stop-color="#212327"/>
    </linearGradient>
    <linearGradient id="oilG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27405e" stop-opacity=".55"/><stop offset="1" stop-color="#16263c" stop-opacity=".75"/>
    </linearGradient>
    <symbol id="pump" viewBox="0 0 64 80">
      <rect x="2" y="2" width="60" height="76" rx="9" fill="#1d2533" stroke="#8fa2c8" stroke-width="1.8"/>
      <circle cx="32" cy="34" r="17" fill="none" stroke="#8fa2c8" stroke-width="1.6"/>
      <g stroke="#5aa7ff" stroke-width="2.4" stroke-linecap="round">
        <path d="M32 20 V48 M18 34 H46 M22 24 L42 44 M42 24 L22 44"/>
        <animateTransform attributeName="transform" type="rotate" from="0 32 34" to="360 32 34" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </symbol>
    <symbol id="hx" viewBox="0 0 160 120">
      <rect x="2" y="2" width="156" height="116" rx="9" fill="#1d2533" stroke="#8fa2c8" stroke-width="1.8"/>
      <path d="M14 22 h132 M14 42 h132 M14 62 h132 M14 82 h132 M14 102 h132" stroke="#3d4f6e" stroke-width="3"/>
    </symbol>
    <symbol id="lvl" viewBox="0 0 26 22">
      <rect x="1" y="1" width="24" height="20" rx="3" fill="none" stroke="#9fb3d9" stroke-width="1.6"/>
      <path d="M5 17 L21 5 M5 11 L14 5" stroke="#9fb3d9" stroke-width="1.4"/>
    </symbol>
    <symbol id="valve" viewBox="0 0 26 16">
      <path d="M1 1 L13 8 L1 15 z M25 1 L13 8 L25 15 z" fill="#0f1622" stroke="#9fb3d9" stroke-width="1.4"/>
    </symbol>
  </defs>

  <rect width="1600" height="1010" fill="#0f1218"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#e8ecf5">A32 — Coolant Flow &amp; Monitoring</text>
  <text x="30" y="62" font-size="12" fill="#7a8194">FOG A Series · animated schematic over cabinet front view · v1</text>

  <!-- ===== monitoring boxes (above cabinet) ===== -->
  <rect x="170" y="92" width="150" height="50" rx="8" class="box"/>
  <text x="245" y="123" text-anchor="middle" class="lbl">Data Hub</text>
  <rect x="1390" y="92" width="150" height="50" rx="8" class="box"/>
  <text x="1465" y="123" text-anchor="middle" class="lbl">Data Hub</text>
  <rect x="1390" y="18" width="150" height="50" rx="8" class="box"/>
  <text x="1465" y="49" text-anchor="middle" class="lbl">Display Panel</text>
  <path class="mon" d="M320 117 H1382" marker-end="url(#aMon)"/>
  <path class="mon" d="M1465 92 V76" marker-end="url(#aMon)"/>

  <!-- ===== cabinet shell ===== -->
  <rect x="80" y="168" width="1440" height="26" rx="6" fill="#1a1c20" stroke="#000" stroke-width="1"/>
  <line x1="96" y1="181" x2="1504" y2="181" class="led"/>
  <rect x="80" y="194" width="1440" height="716" rx="6" fill="url(#bodyG)" stroke="#000" stroke-width="1.5"/>
  <line x1="800" y1="194" x2="800" y2="910" stroke="#111317" stroke-width="3"/>
  <g fill="#16181c" stroke="#0a0b0d" stroke-width="1">
    <rect x="130" y="206" width="64" height="12" rx="4"/><rect x="700" y="206" width="64" height="12" rx="4"/>
    <rect x="836" y="206" width="64" height="12" rx="4"/><rect x="1406" y="206" width="64" height="12" rx="4"/>
  </g>
  <g fill="#101114">
    <rect x="120" y="910" width="36" height="14" rx="4"/><rect x="770" y="910" width="36" height="14" rx="4"/><rect x="1444" y="910" width="36" height="14" rx="4"/>
  </g>

  <!-- Fog Computing logo (bottom-left of left door) -->
  <g fill="#f5c518">
    <g transform="translate(420,838)">
      <path d="M0 14 q4 -8 0 -14 q10 2 10 9 q0 7 -10 5z"/>
      <path d="M14 16 q5 -10 0 -16 q12 2 12 10 q0 8 -12 6z" transform="translate(0,-2)"/>
      <path d="M6 30 q4 -7 1 -12 q9 2 9 8 q0 6 -10 4z"/>
      <path d="M20 32 q5 -8 1 -14 q11 2 11 9 q0 7 -12 5z" transform="translate(0,-2)"/>
    </g>
    <text x="466" y="866" font-size="20" font-weight="700" letter-spacing="2" fill="#f5c518">FOG COMPUTING</text>
  </g>

  <!-- ===== ghost internals ===== -->
  <!-- TANK -->
  <rect x="320" y="240" width="960" height="560" rx="10" fill="url(#oilG)" stroke="#8fa2c8" stroke-width="1.8"/>
  <line x1="330" y1="310" x2="1270" y2="310" stroke="#5aa7ff" stroke-width="1.5" stroke-dasharray="2 4" opacity=".7"/>
  <text x="800" y="560" text-anchor="middle" font-size="26" letter-spacing="6" fill="#c4d0e8">TANK</text>
  <use href="#lvl" x="430" y="256" width="26" height="22"/>
  <use href="#lvl" x="787" y="256" width="26" height="22"/>
  <use href="#lvl" x="1144" y="256" width="26" height="22"/>
  <text x="468" y="273" class="sml">Level Switch</text>

  <!-- LEFT CDU -->
  <rect x="110" y="240" width="200" height="560" rx="10" fill="#161c28" fill-opacity=".85" stroke="#8fa2c8" stroke-width="1.8"/>
  <text x="130" y="274" font-size="22" font-weight="700" fill="#c4d0e8">CDU</text>
  <use href="#pump" x="143" y="330" width="64" height="80"/>
  <use href="#pump" x="223" y="330" width="64" height="80"/>
  <text x="175" y="436" text-anchor="middle" class="sml">Pump</text>
  <text x="255" y="436" text-anchor="middle" class="sml">Pump</text>
  <use href="#hx" x="135" y="580" width="160" height="120"/>
  <text x="215" y="637" text-anchor="middle" class="sml">Heat</text>
  <text x="215" y="654" text-anchor="middle" class="sml">Exchanger</text>
  <!-- hot: tank -> pumps -> pressure -> HX -->
  <path class="flowHot" d="M330 300 H175 V326" marker-end="url(#aHot)"/>
  <path class="flowHot" d="M255 300 V326" marker-end="url(#aHot)"/>
  <path class="flowHot" d="M175 412 V446 H215 M255 412 V446 H215 M215 446 V496"/>
  <path class="flowHot" d="M215 516 V576" marker-end="url(#aHot)"/>
  <circle cx="215" cy="506" r="9" fill="#0f1622" stroke="#9fb3d9" stroke-width="1.6"/>
  <text x="232" y="511" class="sml">Pressure</text>
  <!-- cooled oil back to tank -->
  <path class="flowCold" d="M295 660 H332 V690" marker-end="url(#aCold)"/>
  <!-- facility loop -->
  <path class="flowCold" d="M252 960 V704" marker-end="url(#aCold)"/>
  <path class="flowHot" d="M180 700 V960" marker-end="url(#aHot)"/>
  <use href="#valve" x="239" y="752" width="26" height="16"/>
  <text x="272" y="765" class="sml">Valve</text>

  <!-- RIGHT CDU (mirror) -->
  <rect x="1290" y="240" width="200" height="560" rx="10" fill="#161c28" fill-opacity=".85" stroke="#8fa2c8" stroke-width="1.8"/>
  <text x="1470" y="274" text-anchor="end" font-size="22" font-weight="700" fill="#c4d0e8">CDU</text>
  <use href="#pump" x="1313" y="330" width="64" height="80"/>
  <use href="#pump" x="1393" y="330" width="64" height="80"/>
  <text x="1345" y="436" text-anchor="middle" class="sml">Pump</text>
  <text x="1425" y="436" text-anchor="middle" class="sml">Pump</text>
  <use href="#hx" x="1305" y="580" width="160" height="120"/>
  <text x="1385" y="637" text-anchor="middle" class="sml">Heat</text>
  <text x="1385" y="654" text-anchor="middle" class="sml">Exchanger</text>
  <path class="flowHot" d="M1270 300 H1425 V326" marker-end="url(#aHot)"/>
  <path class="flowHot" d="M1345 300 V326" marker-end="url(#aHot)"/>
  <path class="flowHot" d="M1425 412 V446 H1385 M1345 412 V446 H1385 M1385 446 V496"/>
  <path class="flowHot" d="M1385 516 V576" marker-end="url(#aHot)"/>
  <circle cx="1385" cy="506" r="9" fill="#0f1622" stroke="#9fb3d9" stroke-width="1.6"/>
  <text x="1300" y="511" text-anchor="end" class="sml">Pressure</text>
  <path class="flowCold" d="M1305 660 H1268 V690" marker-end="url(#aCold)"/>
  <path class="flowCold" d="M1348 960 V704" marker-end="url(#aCold)"/>
  <path class="flowHot" d="M1420 700 V960" marker-end="url(#aHot)"/>
  <use href="#valve" x="1335" y="752" width="26" height="16"/>
  <text x="1328" y="765" text-anchor="end" class="sml">Valve</text>

  <!-- ===== monitoring links ===== -->
  <path class="mon" d="M210 240 V150" marker-end="url(#aMon)"/>
  <path class="mon" d="M443 252 V222 H1430 V150" marker-end="url(#aMon)"/>
  <path class="mon" d="M800 252 V222 M1157 252 V222"/>

  <!-- ===== legend ===== -->
  <g font-size="14" fill="#dde4f2">
    <path class="flowHot" d="M1080 968 H1160" marker-end="url(#aHot)"/>
    <text x="1170" y="973">Hot coolant</text>
    <path class="flowCold" d="M1300 968 H1380" marker-end="url(#aCold)"/>
    <text x="1390" y="973">Cool coolant</text>
    <path class="mon" d="M620 968 H700" marker-end="url(#aMon)"/>
    <text x="710" y="973" fill="#aab7d4">Monitoring</text>
  </g>
  <text x="30" y="973" font-size="13" fill="#5a6378">Facility loop: cold in / hot out at cabinet base · 2N pumps per CDU</text>
</svg>
